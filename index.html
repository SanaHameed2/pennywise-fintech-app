<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- ✅ OPTIMIZED FONTS (Non-blocking load) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet" 
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700;750;800&display=swap" 
      media="print" 
      onload="this.media='all'" 
    />

      <link 
        rel="stylesheet" 
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700;750;800&display=swap" 
      />
    </noscript>
    
    <!-- Primary Meta Tags -->
    <title>Pennywise | Smart Personal Finance & Digital Banking</title>
    <meta name="title" content="Pennywise | Smart Personal Finance & Digital Banking" />
    <meta name="description" content="Manage your finances effortlessly with Pennywise, an intuitive fintech app offering real-time balance tracking, secure transactions, and customizable dashboards." />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pennywise-fintech-app.vercel.app/" />
    <meta property="og:title" content="Pennywise | Smart Personal Finance & Digital Banking" />
    <meta property="og:description" content="Manage your finances effortlessly with this intuitive fintech app, offering real-time balance tracking, transaction insights, and customizable dashboards." />
    <meta property="og:image" content="https://pennywise-fintech-app.vercel.app/favicon.svg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://pennywise-fintech-app.vercel.app/" />
    <meta property="twitter:title" content="Pennywise | Smart Personal Finance & Digital Banking" />
    <meta property="twitter:description" content="Manage your finances effortlessly with this intuitive fintech app." />
    <meta property="twitter:image" content="https://pennywise-fintech-app.vercel.app/favicon.svg" />

    <style>
      html, body { 
        height: 100%; 
        margin: 0; 
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        background-color: #050507; /* Prevent white flash on load */
      }
      #root { 
        height: 100%; 
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
